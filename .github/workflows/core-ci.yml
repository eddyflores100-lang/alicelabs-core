name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-worker:
    name: Web build & agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the PWA
        run: pnpm web:build
      - name: Test encrypted owner vault (WebCrypto)
        run: node --experimental-strip-types --test apps/web/test-vault.mjs apps/web/test-agent-team.mjs apps/web/test-owner-grants.mjs apps/web/test-github-workspace.mjs apps/web/test-github-actions.mjs apps/web/test-github-pull-requests.mjs apps/web/test-multifile-team.mjs apps/web/test-github-batch-pr.mjs apps/web/test-github-autopilot.mjs
      - name: Test model routing
        run: pnpm test:web
      - name: Test Worker and public model catalog
        run: pnpm test:worker
      - name: Test remote runner policy without deployment
        run: pnpm --filter @core/remote test && pnpm --filter @core/remote check
      - name: Test independent Core Cloud Coder (no real credentials)
        run: node --experimental-strip-types --test tools/cloud-code-agent.test.mjs tools/core-autopilot-queue.test.mjs
      - name: Test ChatGPT companion pairing (mock, no credentials)
        run: node --test tools/chatgpt-companion/test.mjs
